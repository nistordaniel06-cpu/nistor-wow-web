<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101923"><title>NISTOR WoW — V1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;color:#f7e7bd;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.panel{background:#09111bdc;border:1px solid #b18c43;border-radius:12px;padding:10px 14px;box-shadow:0 4px 18px #0008}h1{font:700 clamp(17px,3vw,27px) Georgia,serif;margin:0;color:#f7d78b;letter-spacing:2px}.small{font-size:11px;color:#c3cbd1;margin-top:4px}#health{height:7px;background:#4a2020;border-radius:10px;margin-top:7px;overflow:hidden}#health b{display:block;background:#d34747;height:100%;width:100%}#status{font-size:12px;text-align:right;max-width:220px}
#bottom{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}#pad{width:142px;height:142px;position:relative;pointer-events:auto;touch-action:none;background:#14223599;border:2px solid #9a8a68;border-radius:50%;box-shadow:0 0 0 8px #0a121955}#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#c8a96c;border:3px solid #f4dfb5;left:42px;top:42px;box-shadow:0 2px 14px #0009}#actions{display:flex;gap:10px;pointer-events:auto}button{background:linear-gradient(#7c5532,#3c2319);border:2px solid #d4b46e;color:#fff0c7;font-weight:700;border-radius:50%;width:65px;height:65px;touch-action:manipulation;box-shadow:0 4px 14px #0009}button:active{filter:brightness(1.4)}#message{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:17px;text-align:center;text-shadow:0 2px 5px #000;max-width:80%}#start{position:absolute;inset:0;background:linear-gradient(160deg,#08111bed,#182b36e8);display:grid;place-items:center;pointer-events:auto}#start article{text-align:center;max-width:430px;padding:28px;border:1px solid #bd9557;border-radius:18px;background:#09111bdc}#start h2{font:700 40px Georgia,serif;color:#f7d78b;margin:0 0 10px}#start p{line-height:1.6;color:#d8d6cd}#start button{width:auto;height:auto;border-radius:10px;padding:14px 24px;margin-top:8px}#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#d8d2c1a8;white-space:nowrap}@media(max-width:600px){#pad{width:116px;height:116px}#knob{left:31px;top:31px}button{width:57px;height:57px}#bottom{bottom:30px;left:16px;right:16px}#status{font-size:10px}}
</style></head><body><canvas id="world"></canvas><div id="hud"><div id="top"><div class="panel"><h1>NISTOR WoW</h1><div class="small">Cavalerul Nistor • Nivel 1</div><div id="health"><b id="hp"></b></div></div><div id="status" class="panel">V1 • DEMO LOCAL<br>Fără conectare AzerothCore<br><span id="kills">Creaturi învinse: 0</span></div></div><div id="message"></div><div id="bottom"><div id="pad" aria-label="Joystick de mișcare"><div id="knob"></div></div><div id="actions"><button id="attack" aria-label="Atacă">⚔️</button><button id="spell" aria-label="Vrajă">✨</button></div></div><div id="hint">Mișcare: joystick / WASD • Atac: ⚔️ / Space</div></div><div id="start"><article><h2>NISTOR WoW</h2><p>Forge Your Legacy<br>Explorează o lume fantasy demonstrativă, direct în browser. Nu este încă un client WoW conectat la server.</p><button id="play">INTRĂ ÎN LUMEA DEMO</button></article></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),pad=document.querySelector('#pad'),knob=document.querySelector('#knob');let W=0,H=0,scale=1,last=0,kills=0,msgUntil=0,started=false,attackUntil=0;const keys=new Set(),joy={x:0,y:0},hero={x:0,y:0,hp:100};const mobs=[{x:270,y:170,hp:3},{x:-260,y:180,hp:3},{x:180,y:-240,hp:3},{x:-210,y:-200,hp:3},{x:380,y:-140,hp:3}];function resize(){scale=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*scale;canvas.height=H*scale;ctx.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);resize();function message(s){document.querySelector('#message').textContent=s;msgUntil=performance.now()+1500}function joystick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,mag=Math.min(1,len/(r.width*.36));joy.x=dx/len*mag;joy.y=dy/len*mag;knob.style.transform='translate('+(joy.x*r.width*.26)+'px,'+(joy.y*r.height*.26)+'px)'}function reset(){joy.x=joy.y=0;knob.style.transform=''}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);joystick(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))joystick(e)});pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'){e.preventDefault();attack()}});addEventListener('keyup',e=>keys.delete(e.code));function attack(){if(!started)return;attackUntil=performance.now()+260;let target=null,dist=110;for(const m of mobs){if(m.hp<=0)continue;const d=Math.hypot(m.x-hero.x,m.y-hero.y);if(d<dist){dist=d;target=m}}if(target){target.hp--;if(target.hp<=0){kills++;document.querySelector('#kills').textContent='Creaturi învinse: '+kills;message('Creatură învinsă! +25 XP')}}else message('Nicio creatură în apropiere')}document.querySelector('#attack').addEventListener('click',attack);document.querySelector('#spell').addEventListener('click',()=>{attack();message('Lovitură magică!')});document.querySelector('#play').addEventListener('click',()=>{document.querySelector('#start').style.display='none';started=true;message('Bine ai venit în NISTOR WoW!')});function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function render(t){const dt=Math.min((t-last)/1000||0,.05);last=t;ctx.clearRect(0,0,W,H);ctx.fillStyle='#426a49';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-hero.x,H/2-hero.y);const minX=Math.floor((hero.x-W/2)/80)-1,maxX=Math.ceil((hero.x+W/2)/80)+1,minY=Math.floor((hero.y-H/2)/80)-1,maxY=Math.ceil((hero.y+H/2)/80)+1;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){const n=Math.abs(Math.sin(x*83.3+y*41.7));ctx.fillStyle=n>.65?'#4c7651':'#416b49';ctx.fillRect(x*80,y*80,80,80);if(n>.78){circle(x*80+20,y*80+35,22,'#264b35');circle(x*80+28,y*80+26,18,'#2f5940')}else if(n<.11){circle(x*80+35,y*80+38,5,'#a0a18a')}}ctx.fillStyle='#bca982';ctx.fillRect(-85,-500,170,1000);ctx.fillStyle='#a8936f';ctx.fillRect(-55,-500,110,1000);for(const m of mobs){if(m.hp<=0)continue;circle(m.x,m.y+8,21,'#1d3027');circle(m.x,m.y,17,'#8c3d35');circle(m.x-5,m.y-4,3,'#ffdc82');circle(m.x+5,m.y-4,3,'#ffdc82');ctx.fillStyle='#181717';ctx.fillRect(m.x-20,m.y-29,40,5);ctx.fillStyle='#d64c4c';ctx.fillRect(m.x-20,m.y-29,40*m.hp/3,5)}circle(hero.x,hero.y+11,22,'#1e302e');circle(hero.x,hero.y,17,'#2b67a4');circle(hero.x,hero.y-8,10,'#d5c5a3');ctx.fillStyle='#e9c66f';ctx.fillRect(hero.x+11,hero.y-18,5,31);if(t<attackUntil){ctx.strokeStyle='#fff4aa';ctx.lineWidth=5;ctx.beginPath();ctx.arc(hero.x,hero.y,36,-1.3,1.4);ctx.stroke()}ctx.restore();if(started){let dx=joy.x+(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),dy=joy.y+(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0),l=Math.hypot(dx,dy);if(l>0){hero.x+=dx/Math.max(l,1)*175*dt;hero.y+=dy/Math.max(l,1)*175*dt}}if(t>msgUntil)document.querySelector('#message').textContent='';requestAnimationFrame(render)}requestAnimationFrame(render)})();
</script></body></html>
