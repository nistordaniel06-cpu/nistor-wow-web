<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NISTOR WoW V5 — Auth Protocol Probe</title>
<style>body{margin:0;background:#101a20;color:#f4e4bf;font:16px system-ui;padding:24px;max-width:680px;margin:auto}h1{color:#e8c779}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:12px;font:inherit}input{background:#1e3036;color:white;border:1px solid #8a7654}button{background:#d7b46a;color:#101a20;border:0;font-weight:700}pre{background:#1d2a30;padding:16px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9c2c2}</style>
<h1>NISTOR WoW · V5</h1><p>Test de protocol AzerothCore 3.3.5a. Nu cere și nu trimite parole.</p>
<label>Cont WoW (doar numele)<input id="username" value="NISTORGM" maxlength="32" autocomplete="off"></label>
<button id="probe">Testează răspunsul AuthServer</button>
<pre id="output">Pregătit. Serverul WebSocket trebuie să ruleze pe portul 8766.</pre>
<small>Testul trimite LOGON_CHALLENGE (0x00) și verifică răspunsul serverului. Nu autentifică utilizatorul și nu accesează personajele.</small>
<script>
const out=document.getElementById('output');
function challenge(name){
 const u=new TextEncoder().encode(name.toUpperCase());
 const body=new Uint8Array(30+u.length);
 let p=0;
 for(const v of [87,111,87,0,3,3,5,0,0x34,0x30,54,56,120,0,110,105,87,0,83,85,110,101,0,0,0,0,127,0,0,1,u.length])body[p++]=v;
 body.set(u,p);
 const packet=new Uint8Array(body.length+4);
 packet[0]=0;packet[1]=0;packet[2]=body.length&255;packet[3]=body.length>>8;packet.set(body,4);
 return packet;
}
document.getElementById('probe').onclick=()=>{
 const name=document.getElementById('username').value.trim().toUpperCase();
 if(!/^[A-Z0-9]{2,32}$/.test(name)){out.textContent='Numele trebuie să aibă 2–32 caractere A-Z sau 0-9.';return;}
 out.textContent='Conectare la AuthServer...';
 const ws=new WebSocket('ws://127.0.0.1:8766/auth');ws.binaryType='arraybuffer';
 const timer=setTimeout(()=>{out.textContent+='\nTimeout după 8 secunde';ws.close()},8000);
 ws.onopen=()=>{const packet=challenge(name);ws.send(packet);out.textContent='LOGON_CHALLENGE trimis pentru '+name+' ('+packet.length+' octeți).\nAștept răspunsul AzerothCore...'};
 ws.onmessage=e=>{clearTimeout(timer);const b=new Uint8Array(e.data);const hex=Array.from(b.slice(0,48),v=>v.toString(16).padStart(2,'0')).join(' ');let result='Răspuns primit: '+b.length+' octeți\nHEX: '+hex;
 if(b.length>=3&&b[0]===0){result+='\nOpcode: LOGON_CHALLENGE (0x00)';result+='\nCod rezultat: 0x'+b[2].toString(16).padStart(2,'0');if(b[2]===0)result+=' — challenge acceptat; SRP6 urmează';else result+=' — serverul a refuzat challenge-ul (verifică numele/build-ul)';}else result+='\nRăspuns neașteptat — trebuie analizat';
 out.textContent=result;ws.close();};
 ws.onerror=()=>{clearTimeout(timer);out.textContent+='\nEroare WebSocket: verifică ws_proxy.py'};
 ws.onclose=()=>clearTimeout(timer);
};
</script></html>
